name: Aplicar melhorias HidraViva

on:
  push:
    branches:
      - ajuste-foto-servidor-rodape-css
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-hidraviva:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ajuste-foto-servidor-rodape-css
      - name: Aplicar foto do servidor e rodape
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          form='<form id="form-servidor" onsubmit="salvarPerfil(event)" class="space-y-4">'
          marker='<!-- FOTO DO SERVIDOR - HIDRAVIVA -->'
          photo='''\n                        <!-- FOTO DO SERVIDOR - HIDRAVIVA -->\n                        <div class="bg-blue-50/60 border border-blue-100 rounded-2xl p-4">\n                            <label class="block text-xs font-semibold text-gray-600 mb-3"><i class="fa-solid fa-camera text-seduc-lightBlue mr-1"></i> Foto do Servidor</label>\n                            <div class="flex flex-col items-center">\n                                <div class="relative mb-3">\n                                    <div id="foto-placeholder" class="w-28 h-28 rounded-full bg-white border-4 border-white shadow-md flex items-center justify-center overflow-hidden"><i class="fa-solid fa-user text-5xl text-gray-300"></i></div>\n                                    <img id="foto-preview" src="" alt="Foto do Servidor" class="hidden w-28 h-28 rounded-full object-cover border-4 border-white shadow-md">\n                                </div>\n                                <p class="text-xs text-gray-500 text-center mb-3">Adicione uma foto para identificação no SEDUC HidraViva.</p>\n                                <input type="file" id="input-foto" accept="image/jpeg,image/png" onchange="selecionarFotoServidor(event)" class="hidden">\n                                <div class="flex flex-wrap justify-center gap-2">\n                                    <button type="button" id="btn-adicionar-foto" onclick="document.getElementById('input-foto').click()" class="bg-seduc-lightBlue hover:bg-blue-700 text-white px-3 py-2 rounded-xl text-xs font-semibold transition"><i class="fa-solid fa-image mr-1"></i>Adicionar foto</button>\n                                    <button type="button" id="btn-alterar-foto" onclick="document.getElementById('input-foto').click()" class="hidden bg-gray-600 hover:bg-gray-700 text-white px-3 py-2 rounded-xl text-xs font-semibold transition"><i class="fa-solid fa-pen mr-1"></i>Alterar</button>\n                                    <button type="button" id="btn-remover-foto" onclick="removerFotoServidor()" class="hidden bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-xl text-xs font-semibold transition"><i class="fa-solid fa-trash mr-1"></i>Remover</button>\n                                </div>\n                                <p class="text-[10px] text-gray-400 mt-3 text-center">JPG, JPEG e PNG • máximo 3 MB.</p>\n                            </div>\n                        </div>\n'''
          if marker not in s:
              if form not in s: raise SystemExit('Formulario nao encontrado')
              s=s.replace(form,form+photo,1)
          jsmarker='// FOTO DO SERVIDOR - FUNCOES HIDRAVIVA'
          save='function salvarPerfil(e) {'
          js=r'''\n        // FOTO DO SERVIDOR - FUNCOES HIDRAVIVA\n        function selecionarFotoServidor(event) {\n            const arquivo=event.target.files&&event.target.files[0]; if(!arquivo)return;\n            if(!['image/jpeg','image/png'].includes(arquivo.type)){mostrarToast('Formato não permitido. Utilize JPG, JPEG ou PNG.','error');event.target.value='';return;}\n            if(arquivo.size>3*1024*1024){mostrarToast('A foto deve possuir no máximo 3 MB.','error');event.target.value='';return;}\n            const leitor=new FileReader(); leitor.onload=function(ev){const img=new Image(); img.onload=function(){const c=document.createElement('canvas'),ctx=c.getContext('2d'),t=400,l=Math.min(img.width,img.height),x=(img.width-l)/2,y=(img.height-l)/2;c.width=t;c.height=t;ctx.drawImage(img,x,y,l,l,0,0,t,t);perfilServidor.foto=c.toDataURL('image/jpeg',0.78);atualizarFotoServidor();salvarLocalStorage();mostrarToast('📷 Foto adicionada com sucesso!','success');};img.src=ev.target.result;};leitor.readAsDataURL(arquivo);\n        }\n        function atualizarFotoServidor(){const p=document.getElementById('foto-preview'),h=document.getElementById('foto-placeholder'),a=document.getElementById('btn-adicionar-foto'),e=document.getElementById('btn-alterar-foto'),r=document.getElementById('btn-remover-foto');if(!p||!h)return;if(perfilServidor.foto){p.src=perfilServidor.foto;p.classList.remove('hidden');h.classList.add('hidden');a&&a.classList.add('hidden');e&&e.classList.remove('hidden');r&&r.classList.remove('hidden');}else{p.src='';p.classList.add('hidden');h.classList.remove('hidden');a&&a.classList.remove('hidden');e&&e.classList.add('hidden');r&&r.classList.add('hidden');}}\n        function removerFotoServidor(){perfilServidor.foto='';const i=document.getElementById('input-foto');if(i)i.value='';atualizarFotoServidor();salvarLocalStorage();mostrarToast('Foto removida do cadastro.','info');}\n\n'''
          if jsmarker not in s:
              if save not in s: raise SystemExit('salvarPerfil nao encontrado')
              s=s.replace(save,js+save,1)
          if 'foto: ""' not in s and "foto: ''" not in s:
              needle='cidade: "Cuiabá (Sede SEDUC/MT)",'
              if needle in s:s=s.replace(needle,needle+'\n            foto: "",',1)
          s=s.replace('Desenvolvido para a Saúde e Qualidade de Vida do Servidor Público','Coordenadoria de Saúde e Segurança – CSS | SEDUC-MT')
          restore="""\n<script>\nwindow.addEventListener('load',function(){try{atualizarFotoServidor();}catch(e){console.warn(e);}});\n</script>\n"""
          if 'window.addEventListener(\'load\',function(){try{atualizarFotoServidor()' not in s:
              s=s.replace('</body>',restore+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Validar e salvar
        run: |
          grep -q "FOTO DO SERVIDOR - HIDRAVIVA" index.html
          grep -q "Coordenadoria de Saúde e Segurança – CSS | SEDUC-MT" index.html
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Adicionar foto do servidor e atualizar rodape CSS"
          git push origin HEAD:ajuste-foto-servidor-rodape-css
