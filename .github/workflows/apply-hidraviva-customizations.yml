name: Aplicar melhorias HidraViva
on:
  push:
    branches:
      - ajuste-foto-servidor-rodape-css
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ajuste-foto-servidor-rodape-css
      - name: Aplicar alteracoes
        run: python3 apply_hidraviva.py
      - name: Validar alteracoes
        run: |
          grep -q "FOTO DO SERVIDOR - HIDRAVIVA" index.html
          grep -q "selecionarFotoServidor" index.html
          grep -q "Coordenadoria de Saúde e Segurança – CSS | SEDUC-MT" index.html
      - name: Salvar na branch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Adicionar foto do servidor e atualizar rodapé CSS"
          git push origin HEAD:ajuste-foto-servidor-rodape-css
