name: Aplicar melhorias HidraViva

on:
  push:
    branches:
      - ajuste-foto-servidor-rodape-css
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-hidraviva:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ajuste-foto-servidor-rodape-css

      - name: Aplicar foto do servidor e rodape
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1) Foto do servidor: injeta o componente visual no inicio do formulario.
          form = '<form id="form-servidor" onsubmit="salvarPerfil(event)" class="space-y-4">'
          marker = '<!-- FOTO DO SERVIDOR - HIDRAVIVA -->'
          photo_html = '''
                        <!-- FOTO DO SERVIDOR - HIDRAVIVA -->
                        <div class="bg-blue-50/60 border border-blue-100 rounded-2xl p-4">
                            <label class="block text-xs font-semibold text-gray-600 mb-3">
                                <i class="fa-solid fa-camera text-seduc-lightBlue mr-1"></i> Foto do Servidor
                            </label>
                            <div class="flex flex-col items-center">
                                <div class="relative mb-3">
                                    <div id="foto-placeholder" class="w-28 h-28 rounded-full bg-white border-4 border-white shadow-md flex items-center justify-center overflow-hidden">
                                        <i class="fa-solid fa-user text-5xl text-gray-300"></i>
                                    </div>
                                    <img id="foto-preview" src="" alt="Foto do Servidor" class="hidden w-28 h-28 rounded-full object-cover border-4 border-white shadow-md">
                                    <div class="absolute bottom-0 right-0 bg-seduc-lightBlue text-white w-9 h-9 rounded-full flex items-center justify-center shadow border-2 border-white">
                                        <i class="fa-solid fa-camera text-sm"></i>
                                    </div>
                                </div>
                                <p class="text-xs text-gray-500 text-center mb-3">Adicione uma foto para identificação no SEDUC HidraViva.</p>
                                <input type="file" id="input-foto" accept="image/jpeg,image/png" onchange="selecionarFotoServidor(event)" class="hidden">
                                <div class="flex flex-wrap justify-center gap-2">
                                    <button type="button" id="btn-adicionar-foto" onclick="document.getElementById('input-foto').click()" class="bg-seduc-lightBlue hover:bg-blue-700 text-white px-3 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-2">
                                        <i class="fa-solid fa-image"></i> Adicionar foto
                                    </button>
                                    <button type="button" id="btn-alterar-foto" onclick="document.getElementById('input-foto').click()" class="hidden bg-gray-600 hover:bg-gray-700 text-white px-3 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-2">
                                        <i class="fa-solid fa-pen"></i> Alterar
                                    </button>
                                    <button type="button" id="btn-remover-foto" onclick="removerFotoServidor()" class="hidden bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-2">
                                        <i class="fa-solid fa-trash"></i> Remover
                                    </button>
                                </div>
                                <p class="text-[10px] text-gray-400 mt-3 text-center">Formatos permitidos: JPG, JPEG e PNG • máximo 3 MB.</p>
                            </div>
                        </div>
          '''
          if marker not in s:
              if form not in s:
                  raise SystemExit('Formulario do servidor nao encontrado; nenhuma alteracao aplicada.')
              s = s.replace(form, form + photo_html, 1)

          # 2) Funcoes da foto. Armazena localmente no navegador e comprime a imagem.
          js_marker = '// FOTO DO SERVIDOR - FUNCOES HIDRAVIVA'
          save_fn = 'function salvarPerfil(e) {'
          photo_js = r'''
        // FOTO DO SERVIDOR - FUNCOES HIDRAVIVA
        function selecionarFotoServidor(event) {
            const arquivo = event.target.files && event.target.files[0];
            if (!arquivo) return;
            if (!['image/jpeg', 'image/png'].includes(arquivo.type)) {
                mostrarToast('Formato não permitido. Utilize JPG, JPEG ou PNG.', 'error');
                event.target.value = '';
                return;
            }
            if (arquivo.size > 3 * 1024 * 1024) {
                mostrarToast('A foto deve possuir no máximo 3 MB.', 'error');
                event.target.value = '';
                return;
            }
            const leitor = new FileReader();
            leitor.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const tamanho = 400;
                    canvas.width = tamanho;
                    canvas.height = tamanho;
                    const lado = Math.min(img.width, img.height);
                    const x = (img.width - lado) / 2;
                    const y = (img.height - lado) / 2;
                    ctx.drawImage(img, x, y, lado, lado, 0, 0, tamanho, tamanho);
                    perfilServidor.foto = canvas.toDataURL('image/jpeg', 0.78);
                    atualizarFotoServidor();
                    salvarLocalStorage();
                    mostrarToast('📷 Foto adicionada com sucesso!', 'success');
                };
                img.src = ev.target.result;
            };
            leitor.readAsDataURL(arquivo);
        }

        function atualizarFotoServidor() {
            const preview = document.getElementById('foto-preview');
            const placeholder = document.getElementById('foto-placeholder');
            const adicionar = document.getElementById('btn-adicionar-foto');
            const alterar = document.getElementById('btn-alterar-foto');
            const remover = document.getElementById('btn-remover-foto');
            if (!preview || !placeholder) return;
            if (perfilServidor.foto) {
                preview.src = perfilServidor.foto;
                preview.classList.remove('hidden');
                placeholder.classList.add('hidden');
                if (adicionar) adicionar.classList.add('hidden');
                if (alterar) alterar.classList.remove('hidden');
                if (remover) remover.classList.remove('hidden');
            } else {
                preview.src = '';
                preview.classList.add('hidden');
                placeholder.classList.remove('hidden');
                if (adicionar) adicionar.classList.remove('hidden');
                if (alterar) alterar.classList.add('hidden');
                if (remover) remover.classList.add('hidden');
            }
        }

        function removerFotoServidor() {
            perfilServidor.foto = '';
            const input = document.getElementById('input-foto');
            if (input) input.value = '';
            atualizarFotoServidor();
            salvarLocalStorage();
            mostrarToast('Foto removida do cadastro.', 'info');
        }

          '''
          if js_marker not in s:
              if save_fn not in s:
                  raise SystemExit('Funcao salvarPerfil nao encontrada; nenhuma alteracao aplicada.')
              s = s.replace(save_fn, photo_js + save_fn, 1)

          # 3) Campo foto no estado do perfil.
          if 'foto: ""' not in s and "foto: ''" not in s:
              needle = 'cidade: "Cuiabá (Sede SEDUC/MT)",'
              if needle in s:
                  s = s.replace(needle, needle + '\n            foto: "",', 1)

          # 4) Restaura a foto salva ao carregar a pagina sem reescrever a funcao existente.
          init_marker = '// FOTO DO SERVIDOR - RESTAURAR AO CARREGAR'
          if init_marker not in s:
              closing = '</script>\n</body>'
              restore = r'''
        // FOTO DO SERVIDOR - RESTAURAR AO CARREGAR
        window.addEventListener('load', function() {
            try { atualizarFotoServidor(); } catch (e) { console.warn('Foto do servidor:', e); }
        });
    '''
              if closing in s:
                  s = s.replace(closing, restore + '\n</script>\n</body>', 1)
              else:
                  # fallback: injeta antes do ultimo fechamento de body
                  pos = s.rfind('</body>')
                  if pos < 0:
                      raise SystemExit('Fechamento body nao encontrado.')
                  s = s[:pos] + '<script>' + restore + '</script>\n' + s[pos:]

          # 5) Rodape institucional CSS.
          s = s.replace(
              'Desenvolvido para a Saúde e Qualidade de Vida do Servidor Público',
              'Coordenadoria de Saúde e Segurança – CSS | SEDUC-MT'
          )

          p.write_text(s, encoding='utf-8')

      - name: Validar alteracoes
        run: |
          grep -q "FOTO DO SERVIDOR - HIDRAVIVA" index.html
          grep -q "Coordenadoria de Saúde e Segurança – CSS | SEDUC-MT" index.html
          grep -q "selecionarFotoServidor" index.html

      - name: Salvar alteracoes na branch
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteracao pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Adicionar foto do servidor e atualizar rodape CSS"
          git push origin HEAD:ajuste-foto-servidor-rodape-css
